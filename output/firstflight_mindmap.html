<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>firstFlight 人机混动软件开发系统 · 全流程思维导图 v11</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2230; --line:#30363d;
    --txt:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --flow:#3b82f6; --agent:#8b5cf6; --skill:#14b8a6; --guard:#f59e0b; --accept:#ef4444;
    --hub:#eab308; --human:#f778ba; --cross:#22d3ee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;}
  #topbar{position:fixed;top:0;left:0;right:0;height:54px;z-index:30;
    background:linear-gradient(180deg,#11161d,#0d1117);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 14px;flex-wrap:nowrap;overflow:hidden;}
  #topbar h1{font-size:14.5px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap;}
  #topbar h1 small{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:8px;}
  .btn{background:var(--bg3);border:1px solid var(--line);color:var(--txt);
    padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);color:#fff;}
  #search{background:#0b0f14;border:1px solid var(--line);color:var(--txt);border-radius:7px;
    padding:5px 9px;font-size:12px;width:170px;outline:none;}
  #search:focus{border-color:var(--accent);}
  .spacer{flex:1;}
  #chips{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;}
  .chip-f{background:var(--bg3);border:1px solid var(--line);color:var(--muted);border-radius:20px;
    padding:4px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap;transition:.15s;}
  .chip-f:hover{color:#fff;}
  .chip-f.on{background:#1f6feb33;border-color:var(--accent);color:#cfe4ff;}
  #hint{position:fixed;bottom:10px;left:12px;z-index:30;font-size:11px;color:var(--muted);
    background:rgba(13,17,23,.75);padding:4px 9px;border-radius:6px;border:1px solid var(--line);}
  #legend{position:fixed;bottom:10px;right:12px;z-index:30;font-size:11px;color:var(--muted);
    background:rgba(13,17,23,.75);padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    display:flex;gap:12px;flex-wrap:wrap;max-width:62vw;}
  .lg{display:flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  #viewport{position:fixed;top:54px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(circle at 20% 20%, rgba(88,166,255,.05), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(139,92,246,.05), transparent 40%),
      var(--bg);}
  #viewport.grabbing{cursor:grabbing;}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;}
  #edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
  .node{position:absolute;transform:translate(-0%,-50%);user-select:none;}
  .node .card{position:relative;border-radius:10px;padding:8px 11px;background:var(--bg2);
    border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.35);transition:.12s;cursor:pointer;}
  .node .card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(88,166,255,.25);}
  .node.root .card{background:linear-gradient(135deg,#1f6feb22,#8b5cf622);border-color:var(--accent);min-width:250px;}
  .node.root .ttl{font-size:15px;font-weight:700;}
  .node.domain .card{border:1px solid var(--dc,#58a6ff);box-shadow:0 0 0 1px color-mix(in srgb,var(--dc,#58a6ff) 35%,transparent) inset,0 2px 12px rgba(0,0,0,.3);min-width:242px;background:linear-gradient(135deg,color-mix(in srgb,var(--dc,#58a6ff) 14%,transparent),#0000);}
  .node.domain .ttl{font-size:13.5px;font-weight:700;color:color-mix(in srgb,var(--dc,#58a6ff) 72%,#fff);line-height:1.35;}
  .node.domain .ph{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .node.stage .card{border-left:5px solid var(--sc,#eab308);min-width:210px;background:var(--bg3);}
  .node.stage .ttl{font-size:13.5px;font-weight:700;}
  .node.stage .ph{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:ui-monospace,monospace;}
  .node.cat .card{display:flex;align-items:center;gap:7px;min-width:160px;border-left:4px solid var(--cc);}
  .node.cat .ico{font-size:14px;}
  .node.cat .ttl{font-size:12.5px;font-weight:600;}
  .node.item .card{background:#10151c;border:1px solid #232a33;min-width:210px;}
  .node.item .ttl{font-size:11.5px;line-height:1.4;}
  .node.item.hubitem .card{border-color:#5c4a12;background:#1a1606;}
  .node.item.humanitem .card{border-color:#4d2b3d;background:#1a0f16;}
  .node.item.crossitem .card{border-color:#164e5a;background:#08161a;}
  .node.hub .card{border:1px solid var(--hub);box-shadow:0 0 0 1px var(--hub) inset,0 2px 12px rgba(234,179,8,.18);min-width:230px;background:linear-gradient(135deg,#eab30814,#0000);}
  .node.hub .ttl{font-size:13.5px;font-weight:700;color:#f5d45e;}
  .node.human .card{border:1px solid var(--human);box-shadow:0 0 0 1px var(--human) inset,0 2px 12px rgba(247,120,186,.16);min-width:230px;background:linear-gradient(135deg,#f778ba14,#0000);}
  .node.human .ttl{font-size:13.5px;font-weight:700;color:#ff9ecb;}
  .node.cross .card{border:1px solid var(--cross);box-shadow:0 0 0 1px var(--cross) inset,0 2px 12px rgba(34,211,238,.16);min-width:230px;background:linear-gradient(135deg,#22d3ee14,#0000);}
  .node.cross .ttl{font-size:13.5px;font-weight:700;color:#7ee7f5;}
  .node.sdlc .card{border:1px solid var(--sdlc,#c9a3f7);box-shadow:0 0 0 1px var(--sdlc,#c9a3f7) inset,0 2px 12px rgba(163,113,247,.16);min-width:252px;background:linear-gradient(135deg,#a371f714,#0000);}
  .node.sdlc .ttl{font-size:13px;font-weight:700;color:var(--sdlc,#c9a3f7);line-height:1.35;}
  .node.sdlc .ph{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:ui-monospace,monospace;}
  .node.item.sdlcitem .card{border-color:#3a2f52;background:#120f1a;}
  .node.skl .card{border:1px solid var(--skl,#14b8a6);box-shadow:0 0 0 1px var(--skl,#14b8a6) inset,0 2px 12px rgba(20,184,166,.16);min-width:246px;background:linear-gradient(135deg,#14b8a614,#0000);}
  .node.skl .ttl{font-size:13px;font-weight:700;color:var(--skl,#5eead4);line-height:1.35;}
  .node.item.sklitem .card{border-color:#1e4a48;background:#081514;}
  .node.dual .card{border:1px solid var(--dual,#ff7b72);box-shadow:0 0 0 1px var(--dual,#ff7b72) inset,0 2px 12px rgba(255,123,114,.16);min-width:250px;background:linear-gradient(135deg,#ff7b7214,#0000);}
  .node.dual .ttl{font-size:13px;font-weight:700;color:#ffa198;line-height:1.35;}
  .node.item.duiitem .card{border-color:#5c2a28;background:#1a0e0e;}
  .node.code .card{border:1px solid var(--code,#f0883e);box-shadow:0 0 0 1px var(--code,#f0883e) inset,0 2px 12px rgba(240,136,62,.16);min-width:250px;background:linear-gradient(135deg,#f0883e14,#0000);}
  .node.code .ttl{font-size:13px;font-weight:700;color:#ffb27a;line-height:1.35;}
  .node.item.codiitem .card{border-color:#5c3a1e;background:#1a1208;}
  .node.ws .card{border:1px solid var(--ws,#3fb950);box-shadow:0 0 0 1px var(--ws,#3fb950) inset,0 2px 12px rgba(63,185,80,.16);min-width:250px;background:linear-gradient(135deg,#3fb95014,#0000);}
  .node.ws .ttl{font-size:13px;font-weight:700;color:#7ee787;line-height:1.35;}
  .node.item.wsiitem .card{border-color:#1e4a2a;background:#08150d;}
  .node.data .card{border:1px solid var(--data,#79c0ff);box-shadow:0 0 0 1px var(--data,#79c0ff) inset,0 2px 12px rgba(121,192,255,.16);min-width:252px;background:linear-gradient(135deg,#79c0ff14,#0000);}
  .node.data .ttl{font-size:13px;font-weight:700;color:#a5d6ff;line-height:1.35;}
  .node.item.dataitem .card{border-color:#244b6b;background:#09141e;}
  .badge{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:20px;margin-top:3px;margin-right:3px;font-weight:600;}
  .badge.done{background:#1f6feb33;color:#79b8ff;border:1px solid #1f6feb66;}
  .badge.partial{background:#f59e0b22;color:#f7c66b;border:1px solid #f59e0b66;}
  .badge.rule{background:#eab30822;color:#f5d45e;border:1px solid #eab30855;}
  .badge.plan{background:#f0883e22;color:#ffb27a;border:1px solid #f0883e66;}
  .badge.cross{background:#22d3ee22;color:#7ee7f5;border:1px solid #22d3ee55;}
  .badge.human{background:#f778ba22;color:#ff9ecb;border:1px solid #f778ba55;}
  .badge.edited{background:#79c0ff22;color:#a5d6ff;border:1px solid #79c0ff55;}
  .node.dim{opacity:.18;filter:grayscale(.7);}
  .toggle{position:absolute;right:-9px;top:50%;transform:translate(0,-50%);width:18px;height:18px;
    border-radius:50%;background:var(--bg3);border:1px solid var(--line);color:var(--accent);
    font-size:11px;line-height:16px;text-align:center;cursor:pointer;z-index:5;}
  .node.collapsed .toggle{background:var(--accent);color:#06121f;}
  #panel{position:fixed;top:54px;right:0;width:390px;max-width:48vw;height:calc(100% - 54px);
    background:#0b0f14ee;border-left:1px solid var(--line);z-index:25;padding:18px 18px 40px;
    overflow-y:auto;backdrop-filter:blur(4px);transform:translateX(100%);transition:.2s;}
  #panel.open{transform:translateX(0);}
  #panel h2{margin:0 0 4px;font-size:16px;}
  #panel .ptype{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  #panel .pdesc{font-size:13px;line-height:1.65;color:#c9d1d9;white-space:pre-wrap;}
  #panel .psrc{margin-top:14px;font-size:11.5px;color:#7ee787;border-left:3px solid #2ea043;padding:6px 10px;background:#2ea04312;border-radius:4px;white-space:pre-wrap;}
  #panel .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:18px;}
  #panel .pcat{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  #panel .chip{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
  #panel .panel-actions{display:flex;gap:8px;align-items:center;margin:14px 0 0;flex-wrap:wrap;}
  #panel .node-edit-label{font-size:11.5px;color:#a5d6ff;font-weight:600;}
  #panel .edit-primary{background:#1f6feb;color:#fff;border-color:#388bfd;font-weight:600;}
  #panel .edit-primary:hover{background:#388bfd;border-color:#58a6ff;}
  #panel .edit-note{font-size:11px;line-height:1.45;color:var(--muted);margin-top:7px;}
  #panel .edit-box{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  #panel .edit-box[hidden],#panel .panel-actions[hidden]{display:none;}
  #panel .edit-box label{display:block;font-size:11.5px;color:#c9d1d9;margin:0 0 5px;}
  #panel .edit-box input,#panel .edit-box textarea{display:block;width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 9px;font:inherit;font-size:12px;line-height:1.45;outline:none;margin-bottom:11px;resize:vertical;}
  #panel .edit-box input:focus,#panel .edit-box textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px #58a6ff22;}
  #panel .edit-box textarea{min-height:76px;}
  #panel .edit-status{min-height:18px;font-size:11px;color:#7ee787;margin-top:6px;}
  .sel .card{outline:2px solid var(--accent);outline-offset:1px;}
  @media (max-width:760px){#panel{width:100%;max-width:100%;}#topbar h1 small{display:none;}}
</style>
</head>
<body>
<div id="topbar">
  <h1>firstFlight 人机混动软件开发系统<small>全流程 v11 · 所有节点可编辑 ｜ 触摸板双指平移 ｜ Ctrl/捏合缩放</small></h1>
  <input id="search" placeholder="搜索节点/来源…" />
  <div id="chips">
    <span class="chip-f on" data-f="all">全部</span>
    <span class="chip-f" data-f="done">已实现</span>
    <span class="chip-f" data-f="partial">部分实现</span>
    <span class="chip-f" data-f="rule">目标</span>
    <span class="chip-f" data-f="accept">仅验收</span>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnExpand">逐层展开</button>
  <button class="btn" id="btnCollapse">全部收起</button>
  <button class="btn" id="btnFit">适配视图</button>
  <button class="btn" id="btnMd">导出大纲</button>
</div>

<div id="viewport">
  <div id="world">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="panel">
  <span class="close" id="pClose">×</span>
  <div class="ptype" id="pType"></div>
  <h2 id="pTitle"></h2>
  <div class="pcat" id="pCat"></div>
  <div class="panel-actions" id="pNodeActions" hidden>
    <button class="btn edit-primary" id="pEditOpen" type="button">编辑</button>
    <span class="node-edit-label">当前节点</span>
    <span class="badge edited" id="pEditedBadge" style="display:none">本机已编辑</span>
  </div>
  <div class="edit-note" id="pEditNote" hidden>修改后点击“保存”；内容写入当前浏览器，“导出大纲”会包含修改后的内容。</div>
  <form class="edit-box" id="pEditForm" hidden>
    <label for="pEditTitle">节点标题（必填）</label>
    <textarea id="pEditTitle" maxlength="600" required></textarea>
    <label for="pEditDesc">补充说明</label>
    <textarea id="pEditDesc" maxlength="4000"></textarea>
    <label for="pEditSrc">工程出处 / 制度依据</label>
    <textarea id="pEditSrc" maxlength="2000"></textarea>
    <div class="panel-actions">
      <button class="btn edit-primary" type="submit">保存</button>
      <button class="btn" id="pEditCancel" type="button">取消</button>
      <button class="btn" id="pEditReset" type="button">恢复原文</button>
    </div>
    <div class="edit-status" id="pEditStatus" role="status" aria-live="polite"></div>
  </form>
  <div class="pdesc" id="pDesc"></div>
  <div class="psrc" id="pSrc" style="display:none"></div>
</div>

<div id="hint">鼠标拖拽或触摸板双指平移 · Ctrl+滚轮 / 触摸板捏合缩放 · 任意节点可编辑 · 点节点右侧 + 逐层展开</div>
<div id="legend">
  <span class="lg"><span class="dot" style="background:var(--flow)"></span>业务流转</span>
  <span class="lg"><span class="dot" style="background:var(--agent)"></span>Agent 工作</span>
  <span class="lg"><span class="dot" style="background:var(--skill)"></span>Agent 技能</span>
  <span class="lg"><span class="dot" style="background:var(--guard)"></span>保障完成</span>
  <span class="lg"><span class="dot" style="background:var(--accept)"></span>保障验收</span>
  <span class="lg"><span class="dot" style="background:var(--hub)"></span>验收体系</span>
  <span class="lg"><span class="dot" style="background:var(--human)"></span>人机分工</span>
  <span class="lg"><span class="dot" style="background:var(--cross)"></span>横切底座</span>
  <span class="lg"><span class="dot" style="background:#58a6ff"></span>顶层领域</span>
  <span class="lg"><span class="dot" style="background:#c9a3f7"></span>SDLC 模型</span>
  <span class="lg"><span class="dot" style="background:#14b8a6"></span>Skill 体系</span>
  <span class="lg"><span class="dot" style="background:#ff7b72"></span>双 Agent 评审</span>
  <span class="lg"><span class="dot" style="background:#f0883e"></span>编码交付</span>
  <span class="lg"><span class="dot" style="background:#3fb950"></span>共享空间</span>
  <span class="lg"><span class="dot" style="background:#79c0ff"></span>入库治理</span>
</div>

<script>
/* =====================================================================
   firstFlight 人机混动软件开发系统 · 全流程思维导图 v11
   主结构：4 个顶层领域 → 7 个流程阶段（每阶段 5 条支线）+ 8 个贯穿视角
           （SDLC 三模型 / Skill 装配体系 / 双 Agent 对抗式评审 / 编码交付流水线 / 共享空间 /
             人机分工 / 横切底座 / 验收体系）+ 未实现能力清单
   支线维度：业务流转 / Agent 工作 / Agent 技能 / 保障完成 / 保障验收
   实现度：done 已实现 · partial 部分实现 · rule 目标(规则驱动) · plan 目标(设计完成·待实现)
   v11 改动：
     ① wheel 默认用于画布平移，兼容笔记本触摸板双指横向/纵向滑动；
     ② 仅 Ctrl+滚轮或浏览器识别出的触摸板捏合手势用于缩放，避免双指移动误触缩放。
   v10 要点：
     ① 编辑能力从叶子扩展到全部节点：系统根、顶层领域、阶段、分组和具体项均可修订；
     ② 自动读取并迁移 v7-v9 已保存的叶子修订，统一写入节点修订存储。
   v9 要点：
     ① 叶子详情顶部增加明确的「编辑」键；编辑态表单顶部保留并突出「保存」键；
     ② 编辑入口固定在说明和工程出处之前，点击叶子后无需滚动即可看到。
   v8 要点：
     ① 修正叶子编辑入口：点击叶子后立即在右侧顶部显示编辑表单，不再需要滚动到底部或二次点击；
     ② 非叶子节点继续显示只读说明，带「+ / –」的分组节点先展开，最末级卡片才进入编辑态。
   v7 要点：
     ① 叶子节点详情支持编辑标题、补充说明与工程出处；修改写入浏览器 localStorage，
        导出大纲时使用修改后的值，并可随时恢复原文；
     ② 新增「入库准确性与持久化治理」：数据契约、来源证据、写入协议、事务与并发、
        对账恢复、数据库变更、权限脱敏、验收测试八个制度组；
     ③ 「仅验收」筛选同时覆盖入库治理节点，验收总览补齐入库合同、事务原子性、
        幂等并发、落库对账、迁移完整性与故障恢复六类证据。
   v6 要点：
     ① 根节点下新增「端到端交付 / Agent 控制面 / 治理审计 / 资产底座」四个领域层，
        原第二层十多个异质分支下沉一级，首屏只显示四个稳定入口；
     ② 修正“Skill 能直接限制 Agent”的表述：Skill 是可复用流程与知识包，不是安全边界；
        真正强制约束来自 AgentSpec、Python 状态机、工具/路径白名单、沙箱、网络策略与门禁；
     ③ Skill 体系补齐不可变注册表、来源/许可证/提交哈希、能力契约、最小装配、预算熔断、
        回归评测、隔离与回滚；高星只做候选发现，官方来源与安全审查优先；
     ④ 增加已核验的外部候选来源：Anthropic skills、Vercel agent-skills、OpenAI Plugins；
        明确“仓库星数≠单个 Skill 质量≠已安装”，所有外部能力先进入隔离评测再准入。
   v5 要点：
     ① PRD 载体统一为 Univer/DOCX——移除 Markdown 正文相关的生成与通路，正文只有一篇连续画布；
        （依据 docs/block-prd-editor.md：正文始终以一篇连续的 Univer/DOCX 画布展示）
     ② 新增 ⚔️ 双 Agent 对抗式评审（贯穿全项目）：异议 Agent 装配「功能等价但实现不同」的 skill、

/* ---- 构造器 ---- */

function ci(title, src){ return {type:"item", title, src:src||"", cross:true}; }

function codi(title, src){ return {type:"item", title, src:src||"", codi:true}; }

function di(title, src){ return {type:"item", title, src:src||"", data:true}; }

/* ---- 展开为节点表 ---- */
const nodeMap = {}; let root;
(function flatten(n, parent, depth){
  n.parent = parent; n.depth = depth;
  if(n.type==="cat"||(n.type==="item"&&false)) n._collapsed = true; else n._collapsed = false;
  if(n.children && n.children.length && n.type!=="cat") n._collapsed = true;
  nodeMap[n.id] = n;
  (n.children||[]).forEach((ch,i)=>{ if(!ch.id) ch.id = n.id+"-"+i; flatten(ch, n, depth+1); });
  if(!parent) root = n;
})(TREE, null, 0);

/* ---- 全节点本地修订：只保存可编辑字段，不序列化树结构或运行态 ---- */
const NODE_EDIT_STORAGE_KEY = "firstflight_mindmap_node_edits_v2";
const LEGACY_LEAF_EDIT_STORAGE_KEY = "firstflight_mindmap_leaf_edits_v1";
const originalNodeValues = {};
const nodeEdits = {};
Object.values(nodeMap).forEach(n=>{
  originalNodeValues[n.id] = {title:n.title||"", desc:n.desc||"", src:n.src||""};
});
function safeEditText(value, max){ return typeof value==="string" ? value.slice(0,max) : ""; }
function loadNodeEdits(){
  try{
    const legacy=JSON.parse(localStorage.getItem(LEGACY_LEAF_EDIT_STORAGE_KEY)||"{}");
    const current=JSON.parse(localStorage.getItem(NODE_EDIT_STORAGE_KEY)||"{}");
    const saved={...legacy,...current};
    Object.entries(saved).forEach(([id,edit])=>{

      Object.assign(n,normalized); nodeEdits[id]=normalized;
    });
  }catch(_error){ /* localStorage 不可用时仍保持只读浏览能力 */ }
}
function persistNodeEdits(){
  try{ localStorage.setItem(NODE_EDIT_STORAGE_KEY,JSON.stringify(nodeEdits)); return true; }
  catch(_error){ return false; }
}
loadNodeEdits();
/* 默认只显示四个顶层领域；原先直接挂 root 的流程/控制/治理/底座分支全部下沉一级。
   更深的层级靠点击节点逐层展开；卡片高度按真实内容实测，长文本不再互相压叠 */
Object.values(nodeMap).forEach(n=>{ n._collapsed = n.depth>=1 && !!n.children && n.children.length>0; });

/* ---- 布局 ---- */
const X_UNIT = 268, V_GAP = 16, PAD = 60;
/* 高度缓存：优先用真实 DOM 实测高度；未测量时按字符宽度估算换行行数兜底 */
const MEASURED = {};
const FONT = {root:15, domain:13.5, stage:13.5, cat:12.5, item:11.5, hub:13.5, human:13.5, cross:13.5, sdlc:13, skl:13, dual:13, code:13, ws:13, data:13};
function estLines(text, fs, maxW){
  let lines=1, w=0;
  for(const ch of text){
    const c=ch.charCodeAt(0);
    const cw=(c>0x2E7F?1:0.56)*fs;          // CJK 全宽，西文/数字约半宽
    if(w+cw>maxW && w>0){ lines++; w=cw; } else w+=cw;
  }
  return lines;
}
function estHeight(n){
  const fs=FONT[n.type]||12, w=(NODE_W[n.type]||200)-24, lh=fs*1.44;
  if(n.type==="cat") return 32;
  let h=16+estLines(n.title||"",fs,w)*lh;
  if(n.type==="domain" && n.summary) h+=4+11.5*1.35;
  if(n.type==="stage"){ h+=4+11.5*1.35; if(n.impl||n.owner) h+=4+16; }
  if((n.type==="sdlc"||n.type==="skl"||n.type==="dual"||n.type==="code"||n.type==="ws")&&n.impl) h+=4+16;
  if((n.type==="hub"||n.type==="human"||n.type==="cross")&&n.tag) h+=4+16;
  return Math.max(h,30);
}
function heightOf(n){ return MEASURED[n.id] || estHeight(n); }
/* 按叶子卡片的真实高度逐个下移，杜绝纵向压叠 */
function layout(){
  let cursor = PAD;
  function assign(n, depth){
    n.x = PAD + depth*X_UNIT;
    const kids = visibleChildren(n);
    if(!kids.length){ const h=heightOf(n); n.y = cursor + h/2; cursor += h + V_GAP; return n.y; }
    let sum=0; kids.forEach(ch=> sum+=assign(ch, depth+1));
    n.y = sum/kids.length; return n.y;
  }
  assign(root,0);
}
function visibleChildren(n){
  if(!n.children) return [];
  if(n._collapsed && !searchActive()) return [];
  return n.children.filter(ch=> kept.has(ch.id));
}
function searchActive(){ return state.query.trim().length>0; }

const world = document.getElementById("world");
const nodesEl = document.getElementById("nodes");
const svg = document.getElementById("edges");
const NODE_W = {root:250, domain:242, stage:214, cat:170, item:216, hub:234, human:234, cross:234, sdlc:252, skl:246, dual:250, code:250, ws:250, data:252};

/* ---- 过滤/搜索 ---- */
const state = { query:"", filter:"all", selected:null };
let kept = new Set();

function isAcceptNode(n){
  let p=n;
  while(p){
    if(p.id==="accept-hub"||p.id==="data-hub"||p.cat==="accept") return true;
    p=p.parent;
  }
  return false;
}
function ancestorStage(n){ let p=n.parent; while(p){ if(p.type==="stage") return p; p=p.parent; } return null; }
/* 就近的显式实现度声明：自身或最近祖先上的 impl（SDLC 分支与 Roadmap 分支靠它参与筛选） */
function declaredImpl(n){ let p=n; while(p){ if(p.impl) return p.impl; p=p.parent; } return null; }
function implOk(n){
  if(state.filter==="all") return true;
  if(state.filter==="accept") return isAcceptNode(n) || n.type==="root";
  if(n.type==="root") return true;
  const d = declaredImpl(n);
  /* 「目标」筛选同时覆盖 rule（规则已驱动）与 plan（设计完成·待实现） */
  if(d) return state.filter==="rule" ? (d==="rule"||d==="plan") : d === state.filter;
  const st = ancestorStage(n);
  if(!st) return false;
  return st.impl === state.filter;
}
function textOf(n){ return ((n.title||"")+" "+(n.desc||"")+" "+(n.src||"")+" "+(n.phase||"")).toLowerCase(); }
function computeKept(){
  const q = state.query.trim().toLowerCase();
  const out = new Set();
  function walk(n){
    let childHit = false;
    (n.children||[]).forEach(ch=>{ if(walk(ch)) childHit=true; });
    const selfHit = !q || textOf(n).includes(q);
    let keep = selfHit || (q && childHit);
    if(keep && !implOk(n)) keep = false;
    // 祖先通路：自身被过滤但仍有保留的后代时，保留为连接节点
    if(!keep && childHit) keep = true;
    if(keep) out.add(n.id);
    return keep || childHit;
  }
  walk(root);
  out.add(root.id);
  return out;
}

/* ---- 渲染：先建 DOM（卡片定宽）→ 实测高度 → 布局定位 → 画边 ---- */
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function buildNodeEl(n){
  const el=document.createElement("div");

  if(n.type==="item"){ if(n.hub) cls+=" hubitem"; if(n.human) cls+=" humanitem"; if(n.cross) cls+=" crossitem"; if(n.sdlc) cls+=" sdlcitem"; if(n.skl) cls+=" sklitem"; if(n.dui) cls+=" duiitem"; if(n.codi) cls+=" codiitem"; if(n.wsi) cls+=" wsiitem"; if(n.data) cls+=" dataitem"; }
  if(n._collapsed) cls+=" collapsed";
  if(state.selected===n.id) cls+=" sel";
  if(state._dimmedSet && state._dimmedSet.has(n.id)) cls+=" dim";
  el.className=cls;
  if(n.type==="stage") el.style.setProperty("--sc", STAGE_COLORS[(+n.id.slice(1))%STAGE_COLORS.length]);
  if(n.type==="domain") el.style.setProperty("--dc", n.color || "#58a6ff");
  if(n.type==="cat") el.style.setProperty("--cc", n.color);
  if(n.type==="sdlc") el.style.setProperty("--sdlc", n.mcolor || "#c9a3f7");
  if(n.type==="skl") el.style.setProperty("--skl", n.mcolor || "#5eead4");
  if(n.type==="dual") el.style.setProperty("--dual", n.mcolor || "#ff7b72");
  if(n.type==="code") el.style.setProperty("--code", n.mcolor || "#f0883e");
  if(n.type==="ws") el.style.setProperty("--ws", n.mcolor || "#3fb950");
  if(n.type==="data") el.style.setProperty("--data", n.mcolor || "#79c0ff");
  const w = NODE_W[n.type]||190;
  let inner=`<div class="card" style="width:${w}px">`;
  if(n.type==="root") inner+=`<div class="ttl">${escapeHtml(n.title)}</div>`;
  else if(n.type==="domain") inner+=`<div class="ttl">${escapeHtml(n.title)}</div><div class="ph">${escapeHtml(n.summary||"")}</div>`;
  else if(n.type==="stage"){ inner+=`<div class="ttl">${escapeHtml(n.title)}</div><div class="ph">${escapeHtml(n.phase||"")}</div>`; if(n.impl) inner+=badge(n.impl); if(n.owner) inner+=`<span class="badge human">${escapeHtml(n.owner)}</span>`; }
  else if(n.type==="hub"||n.type==="human"||n.type==="cross"){ inner+=`<div class="ttl">${escapeHtml(n.title)}</div>`; if(n.tag) inner+=badge("cross"); }
  else if(n.type==="sdlc"){ inner+=`<div class="ttl">${escapeHtml(n.title)}</div>`; if(n.impl) inner+=badge(n.impl); }
  else if(n.type==="skl"){ inner+=`<div class="ttl">${escapeHtml(n.title)}</div>`; if(n.impl) inner+=badge(n.impl); }
  else if(n.type==="dual"||n.type==="code"||n.type==="ws"||n.type==="data"){ inner+=`<div class="ttl">${escapeHtml(n.title)}</div>`; if(n.impl) inner+=badge(n.impl); }
  else if(n.type==="cat") inner+=`<span class="ico">${escapeHtml(n.icon)}</span><span class="ttl">${escapeHtml(n.title)}</span>`;
  else inner+=`<div class="ttl">${escapeHtml(n.title)}</div>`;
  inner+=`</div>`;
  if(n.children&&n.children.length && !searchActive()) inner+=`<div class="toggle">${n._collapsed?"+":"–"}</div>`;
  el.innerHTML=inner;
  el.addEventListener("click",e=>{ if(e.target.classList.contains("toggle")) return; selectNode(n); });
  const tg=el.querySelector(".toggle");
  if(tg) tg.addEventListener("click",e=>{ e.stopPropagation(); toggle(n); });
  return el;
}
function render(){
  kept = computeKept();
  const vis = [];
  (function collect(n){ if(!kept.has(n.id)) return; vis.push(n); visibleChildren(n).forEach(collect); })(root);
  /* 1) 先建成节点（尚未定位），用于测量真实高度 */
  nodesEl.innerHTML=""; svg.innerHTML="";
  const els={};
  vis.forEach(n=>{ const el=buildNodeEl(n); els[n.id]=el; nodesEl.appendChild(el); });
  vis.forEach(n=>{ const h=els[n.id].offsetHeight; if(h>0) MEASURED[n.id]=h; });
  /* 2) 用真实高度布局，长卡片不会再互相压叠 */
  layout();
  /* 3) 定位 + 计算画布尺寸 */
  let maxX=0, maxY=0;
  vis.forEach(n=>{
    const w=NODE_W[n.type]||190, h=heightOf(n);
    els[n.id].style.left=n.x+"px"; els[n.id].style.top=n.y+"px";
    maxX=Math.max(maxX, n.x+w); maxY=Math.max(maxY, n.y+h/2);
  });
  const W=maxX+PAD, H=maxY+PAD;
  world.style.width=W+"px"; world.style.height=H+"px";
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  /* 4) 连线 */
  vis.forEach(n=>{
    (n._collapsed?[]:(n.children||[])).forEach(ch=>{
      if(!kept.has(ch.id)) return;
      const x1=n.x+(NODE_W[n.type]||190), y1=n.y, x2=ch.x, y2=ch.y, mx=(x1+x2)/2;
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d",`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
      p.setAttribute("fill","none"); p.setAttribute("stroke", edgeColor(n,ch));
      p.setAttribute("stroke-width","1.6"); p.setAttribute("opacity", n._dim?".08":".5");
      svg.appendChild(p);
    });
  });
}
let selected=null;
function edgeColor(p,ch){
  if(ch.type==="domain") return ch.color || "#58a6ff";
  if(ch.type==="cat") return ch.color;
  if(ch.type==="hub"||ch.id==="accept-hub") return "#eab308";
  if(ch.type==="human") return "#f778ba";
  if(ch.type==="cross") return "#22d3ee";
  if(ch.type==="sdlc") return ch.mcolor || "#c9a3f7";
  if(ch.type==="skl") return "#14b8a6";
  if(ch.type==="dual") return "#ff7b72";
  if(ch.type==="code") return "#f0883e";
  if(ch.type==="ws") return "#3fb950";
  if(ch.type==="data") return "#79c0ff";
  if(ch.type==="stage") return STAGE_COLORS[(+ch.id.slice(1))%STAGE_COLORS.length];
  if(ch.hub) return "#eab308"; if(ch.human) return "#f778ba"; if(ch.cross) return "#22d3ee";
  if(ch.sdlc) return "#7d5fbf";
  if(ch.skl) return "#2dd4bf";
  if(ch.dui) return "#ff7b72";
  if(ch.codi) return "#f0883e";
  if(ch.wsi) return "#3fb950";
  if(ch.data) return "#79c0ff";
  return "#30363d";
}
function badge(t){
  if(t==="done") return `<span class="badge done">已实现</span>`;
  if(t==="partial") return `<span class="badge partial">部分实现</span>`;
  if(t==="rule") return `<span class="badge rule">目标·规则驱动</span>`;
  if(t==="plan") return `<span class="badge plan">目标·设计完成</span>`;
  if(t==="cross") return `<span class="badge cross">贯穿全程</span>`;
  return "";
}
function toggle(n){ if(!n.children||!n.children.length) return; n._collapsed=!n._collapsed; render(); }

let activeNodeEditId=null;
function configureNodeEditor(n){
  activeNodeEditId=n?n.id:null;
  const actions=document.getElementById("pNodeActions");
  const note=document.getElementById("pEditNote");
  const form=document.getElementById("pEditForm");
  const desc=document.getElementById("pDesc");
  const src=document.getElementById("pSrc");
  actions.hidden=!n; note.hidden=true; form.hidden=true;
  desc.style.display="block";
  document.getElementById("pEditedBadge").style.display=n&&nodeEdits[n.id]?"inline-block":"none";
  if(n){
    document.getElementById("pEditTitle").value=n.title||"";
    document.getElementById("pEditDesc").value=n.desc||"";
    document.getElementById("pEditSrc").value=n.src||"";
    document.getElementById("pEditStatus").textContent="";
  }else document.getElementById("pEditStatus").textContent="";
}
function openNodeEditor(){
  const n=nodeMap[activeNodeEditId];
  if(!n) return;
  document.getElementById("pEditTitle").value=n.title||"";
  document.getElementById("pEditDesc").value=n.desc||"";
  document.getElementById("pEditSrc").value=n.src||"";
  document.getElementById("pEditForm").hidden=false;
  document.getElementById("pEditNote").hidden=false;
  document.getElementById("pDesc").style.display="none";
  document.getElementById("pSrc").style.display="none";
  document.getElementById("pEditStatus").textContent=nodeEdits[n.id]?"正在编辑本机修订版":"正在编辑原始内容";
  document.getElementById("pEditTitle").focus();
}
function sameNodeValue(a,b){ return a.title===b.title&&a.desc===b.desc&&a.src===b.src; }

function selectNode(n){
  state.selected=n.id; selected=n.id; render();
  const p=document.getElementById("panel");
  document.getElementById("pType").textContent = typeLabel(n);
  document.getElementById("pTitle").textContent = n.title;
  const cat=document.getElementById("pCat"); cat.innerHTML="";
  if(n.type==="stage"){ if(n.impl) cat.innerHTML+=badge(n.impl); if(n.owner) cat.innerHTML+=`<span class="chip">${n.owner}</span>`; }
  if(n.type==="domain") cat.innerHTML+=`<span class="chip" style="border-color:${n.color||"#58a6ff"};color:${n.color||"#58a6ff"}">顶层领域</span>`;
  if(n.type==="cat"){ const m=CAT[n.cat]; cat.innerHTML+=`<span class="chip" style="border-color:${m.color};color:${m.color}">${m.icon} ${m.label}</span>`; }
  if(n.type==="hub") cat.innerHTML+=`<span class="chip" style="border-color:#eab308;color:#eab308">验收体系</span>`;
  if(n.type==="human") cat.innerHTML+=`<span class="chip" style="border-color:#f778ba;color:#f778ba">人机分工</span>`;
  if(n.type==="cross") cat.innerHTML+=`<span class="chip" style="border-color:#22d3ee;color:#22d3ee">${n.id==="roadmap"?"未实现 / 设计边界":"横切底座"}</span>`;
  if(n.type==="sdlc") cat.innerHTML+=`<span class="chip" style="border-color:${n.mcolor||"#c9a3f7"};color:${n.mcolor||"#c9a3f7"}">SDLC 模型</span>`;
  if(n.type==="skl") cat.innerHTML+=`<span class="chip" style="border-color:#5eead4;color:#5eead4">Skill 装配</span>`;
  if(n.type==="dual") cat.innerHTML+=`<span class="chip" style="border-color:#ff7b72;color:#ffa198">双 Agent 评审</span>`;
  if(n.type==="code") cat.innerHTML+=`<span class="chip" style="border-color:#f0883e;color:#ffb27a">编码交付</span>`;
  if(n.type==="ws") cat.innerHTML+=`<span class="chip" style="border-color:#3fb950;color:#7ee787">共享空间</span>`;
  if(n.type==="data") cat.innerHTML+=`<span class="chip" style="border-color:#79c0ff;color:#a5d6ff">入库治理</span>`;
  if(n.phase) cat.innerHTML+=`<span class="chip">${n.phase}</span>`;
  document.getElementById("pDesc").textContent = n.desc || (n.src? "（见下方工程出处）":"");
  const ps=document.getElementById("pSrc");
  if(n.src){ ps.style.display="block"; ps.textContent="📚 工程出处："+n.src; } else ps.style.display="none";
  configureNodeEditor(n);
  p.classList.add("open");
}
function typeLabel(n){ return {root:"系统根",domain:"顶层领域",stage:"流程阶段",cat:"支线维度",item:"具体项",hub:"验收体系",human:"人机分工",cross:"横切底座",sdlc:"SDLC 模型",skl:"Skill 装配",dual:"双 Agent 评审",code:"编码交付",ws:"共享空间",data:"入库治理"}[n.type]||""; }

document.getElementById("pEditOpen").addEventListener("click",openNodeEditor);
document.getElementById("pEditCancel").addEventListener("click",()=>{
  const n=nodeMap[activeNodeEditId];
  if(!n) return;
  document.getElementById("pEditTitle").value=n.title||"";
  document.getElementById("pEditDesc").value=n.desc||"";
  document.getElementById("pEditSrc").value=n.src||"";
  document.getElementById("pEditForm").hidden=true;
  document.getElementById("pEditNote").hidden=true;
  document.getElementById("pDesc").style.display="block";
  document.getElementById("pSrc").style.display=n.src?"block":"none";
  document.getElementById("pEditStatus").textContent="";
});
document.getElementById("pEditForm").addEventListener("submit",event=>{
  event.preventDefault();
  const n=nodeMap[activeNodeEditId];
  if(!n) return;
  const next={
    title:safeEditText(document.getElementById("pEditTitle").value,600).trim(),
    desc:safeEditText(document.getElementById("pEditDesc").value,4000),
    src:safeEditText(document.getElementById("pEditSrc").value,2000),
  };
  if(!next.title){ document.getElementById("pEditStatus").textContent="标题不能为空"; return; }
  Object.assign(n,next);
  if(sameNodeValue(next,originalNodeValues[n.id])) delete nodeEdits[n.id]; else nodeEdits[n.id]=next;
  const persisted=persistNodeEdits();
  selectNode(n); openNodeEditor();
  document.getElementById("pEditStatus").textContent=persisted?"已保存到当前浏览器":"已应用到当前页面，但浏览器存储失败";
});
document.getElementById("pEditReset").addEventListener("click",()=>{
  const n=nodeMap[activeNodeEditId], original=originalNodeValues[activeNodeEditId];
  if(!n||!original) return;
  Object.assign(n,original); delete nodeEdits[n.id];
  const persisted=persistNodeEdits();
  selectNode(n); openNodeEditor();
  document.getElementById("pEditStatus").textContent=persisted?"已恢复原文":"已在当前页面恢复；浏览器存储更新失败";
});

/* ---- 平移/缩放 ---- */
let tx=0,ty=0,zoom=1;
const vp=document.getElementById("viewport");
function apply(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${zoom})`; }
function fitView(){
  const vis=[]; (function collect(n){ if(!kept.has(n.id))return; vis.push(n); visibleChildren(n).forEach(collect); })(root);
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  vis.forEach(n=>{ const w=NODE_W[n.type]||190, h=heightOf(n); minX=Math.min(minX,n.x); minY=Math.min(minY,n.y-h/2); maxX=Math.max(maxX,n.x+w); maxY=Math.max(maxY,n.y+h/2); });
  const vw=vp.clientWidth, vh=vp.clientHeight;
  let z=Math.min(vw/(maxX-minX+90), vh/(maxY-minY+90), 1.12); if(z<0.22) z=0.22;
  zoom=z; tx=(vw-(maxX-minX)*zoom)/2-(minX-40)*zoom; ty=(vh-(maxY-minY)*zoom)/2-(minY-20)*zoom; apply();
}
/* 首屏聚焦主干：优先 1:1 显示（文字最清晰）；若整条主干放不下，等比缩到刚好装下（下限 0.7 保可读） */
function focusTop(){
  const vis=[]; (function collect(n){ if(!kept.has(n.id))return; vis.push(n); visibleChildren(n).forEach(collect); })(root);
  if(!vis.length) return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  vis.forEach(n=>{ const w=NODE_W[n.type]||190, h=heightOf(n);
    minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x+w);
    minY=Math.min(minY,n.y-h/2); maxY=Math.max(maxY,n.y+h/2); });
  const vw=vp.clientWidth, vh=vp.clientHeight;
  let z=Math.min(1,(vw-90)/(maxX-minX),(vh-36)/((maxY-minY)||1));
  if(z<0.7) z=0.7;
  zoom=z;
  tx=(vw-(maxX-minX)*zoom)/2-minX*zoom;
  ty = ((maxY-minY)*zoom+28<=vh) ? (vh-(maxY-minY)*zoom)/2-minY*zoom : 18;
  apply();
}
let dragging=false,sx=0,sy=0,ox=0,oy=0;
vp.addEventListener("mousedown",e=>{ if(e.target.closest(".node"))return; dragging=true; sx=e.clientX; sy=e.clientY; ox=tx; oy=ty; vp.classList.add("grabbing"); });
window.addEventListener("mousemove",e=>{ if(!dragging)return; tx=ox+(e.clientX-sx); ty=oy+(e.clientY-sy); apply(); });
window.addEventListener("mouseup",()=>{ dragging=false; vp.classList.remove("grabbing"); });
vp.addEventListener("wheel",e=>{
  e.preventDefault();
  /* 触摸板双指滑动与普通滚轮默认平移；Ctrl+滚轮（以及浏览器映射的捏合手势）才缩放。 */
  if(!e.ctrlKey && !e.metaKey){
    tx-=e.deltaX; ty-=e.deltaY; apply(); return;
  }
  const f=Math.exp(-e.deltaY*0.002);
  const nz=Math.max(0.2,Math.min(2.4,zoom*f));
  const r=vp.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
  tx=cx-(cx-tx)*(nz/zoom); ty=cy-(cy-ty)*(nz/zoom); zoom=nz; apply();
},{passive:false});

/* ---- 控制 ---- */
/* 节点当前是否真的可见（祖先链上没有折叠） */
function isVisibleNode(n){
  let p=n.parent;
  while(p){ if(p._collapsed) return false; p=p.parent; }
  return true;
}
document.getElementById("btnFit").onclick=fitView;
/* 逐层展开：只展开「当前可见且处于折叠」的节点，连点可一层层推进 */
document.getElementById("btnExpand").onclick=()=>{
  kept = computeKept();
  const targets = Object.values(nodeMap).filter(n=>n._collapsed && kept.has(n.id) && isVisibleNode(n) && n.children && n.children.length);
  if(!targets.length) return;
  targets.forEach(n=>{ n._collapsed=false; });
  render(); focusTop();
};
/* 全部收起：回到主干视图 */
document.getElementById("btnCollapse").onclick=()=>{
  Object.values(nodeMap).forEach(n=>{ if(n.depth>=1 && n.children && n.children.length) n._collapsed=true; });
  render(); focusTop();
};
document.getElementById("pClose").onclick=()=>document.getElementById("panel").classList.remove("open");
document.getElementById("search").addEventListener("input",e=>{ state.query=e.target.value; render(); });
document.querySelectorAll(".chip-f").forEach(ch=>ch.addEventListener("click",()=>{
  document.querySelectorAll(".chip-f").forEach(x=>x.classList.remove("on")); ch.classList.add("on");
  state.filter=ch.dataset.f;
  /* 只展开「有匹配后代」的节点，避免筛选后整图炸开 */
  kept = computeKept();
  Object.values(nodeMap).forEach(n=>{ if((n.children||[]).some(c=>kept.has(c.id))) n._collapsed=false; });
  render(); focusTop();
}));
document.getElementById("btnMd").onclick=()=>{
  const lines=["# firstFlight 人机混动软件开发系统 · 全流程大纲（含本机节点修订）",""];
  (function walk(n,d){
    if(n.type!=="root"){
      const pad="  ".repeat(d);
      lines.push(pad+"- "+n.title);
      if(n.desc) String(n.desc).split("\n").filter(Boolean).forEach(line=>lines.push(pad+"  - 说明："+line));
      if(n.src) lines.push(pad+"  - 出处："+n.src);
    }
    (n.children||[]).forEach(ch=>walk(ch,n.type==="root"?1:d+1));
  })(root,0);
  const blob=new Blob([lines.join("\n")],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="firstflight_outline.md"; a.click();
};

/* ---- 首次渲染：1:1 聚焦四领域总览（可读性优先），并打开控制面说明 ---- */
render(); focusTop(); selectNode(nodeMap["domain-control"]);
window.addEventListener("resize",()=>fitView());
</script>
